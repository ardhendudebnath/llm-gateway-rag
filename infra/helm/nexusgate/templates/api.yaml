{{- $component := dict "root" . "component" "api" }}
# The API. Rate limits, the semantic cache, canary route tables and circuit state all live in Redis,
# so every replica sees the same picture and the replica count is free to change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexusgate.componentName" $component }}
  labels:
    {{- include "nexusgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nexusgate.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexusgate.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- include "nexusgate.rolloutAnnotations" . | nindent 8 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- include "nexusgate.waitForDeps" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "nexusgate.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "nexusgate.configName" . }}
            - secretRef:
                name: {{ include "nexusgate.secretName" . }}
          # Loading the embedding and reranking models takes a few seconds: up to 60 s of start-up
          # before liveness applies.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexusgate.componentName" $component }}
  labels:
    {{- include "nexusgate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "nexusgate.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
