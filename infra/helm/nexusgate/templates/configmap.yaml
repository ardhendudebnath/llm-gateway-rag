apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexusgate.configName" . }}
  labels:
    {{- include "nexusgate.labels" . | nindent 4 }}
data:
  NEXUSGATE_REDIS_URL: {{ include "nexusgate.redisUrl" . | quote }}
  NEXUSGATE_QDRANT_URL: {{ include "nexusgate.qdrantUrl" . | quote }}
  NEXUSGATE_WORKER_MODE: "celery"
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
