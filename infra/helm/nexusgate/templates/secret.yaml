{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexusgate.secretName" . }}
  labels:
    {{- include "nexusgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEXUSGATE_ADMIN_TOKEN: {{ required "secrets.adminToken is required (or set secrets.existingSecret)" .Values.secrets.adminToken | quote }}
  {{- $jwt := required "secrets.jwtSecret is required (or set secrets.existingSecret)" .Values.secrets.jwtSecret }}
  {{- if lt (len $jwt) 32 }}
  {{- fail "secrets.jwtSecret must be at least 32 characters" }}
  {{- end }}
  NEXUSGATE_JWT_SECRET: {{ $jwt | quote }}
  NEXUSGATE_QDRANT_API_KEY: {{ required "secrets.qdrantApiKey is required (or set secrets.existingSecret)" .Values.secrets.qdrantApiKey | quote }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
