# Base stack, cluster-agnostic:  kubectl apply -k infra/k8s/base
# Local kind cluster on Podman:  scripts/cluster-up.ps1 (or .sh), which applies overlays/kind
#
# Secrets (admin token, JWT secret, provider API keys) are NOT in git: the cluster-up scripts create
# the `nexusgate-secrets` Secret from .env, generating random values for anything missing.
#
# Later roadmap weeks add: qdrant (RAG), celery workers (ingestion), langfuse (LLM tracing).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexusgate
labels:
  - pairs:
      app.kubernetes.io/part-of: nexusgate

resources:
  - namespace.yaml
  - redis.yaml
  - api.yaml
  - prometheus.yaml
  - grafana.yaml

# Generated ConfigMaps get a content-hash suffix, so changing any of these rolls the pods.
configMapGenerator:
  - name: nexusgate-config
    literals:
      - NEXUSGATE_ENV=prod
      - NEXUSGATE_LOG_LEVEL=INFO
      - NEXUSGATE_REDIS_URL=redis://redis:6379/0
      - NEXUSGATE_CACHE_INDEX_BACKEND=redisearch
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=config/grafana-datasources.yml
