# The self-hosted model: llama.cpp's OpenAI-compatible server with Qwen2.5-1.5B-Instruct (4-bit)
# baked into the image (Containerfile.llm), on CPU. The `local` route sends traffic here, and the
# `default` route falls back to it when the paid providers fail. Metered as self-hosted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm
          image: nexusgate-llm
          env:
            # Threads match the CPU limit: more threads than cores only adds contention.
            - name: LLAMA_ARG_THREADS
              value: "4"
            # Two requests decode at once; the context is shared between them (4096 tokens each,
            # enough for a RAG prompt with its passages).
            - name: LLAMA_ARG_N_PARALLEL
              value: "2"
            - name: LLAMA_ARG_CTX_SIZE
              value: "8192"
          ports:
            - name: http
              containerPort: 8080
          # /health answers 503 while the model loads and 200 once it can serve.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  labels:
    app.kubernetes.io/name: llm
spec:
  selector:
    app.kubernetes.io/name: llm
  ports:
    - name: http
      port: 8080
      targetPort: http
