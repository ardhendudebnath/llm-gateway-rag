# Overlay for a local kind cluster: the image built by Podman and loaded into kind, plus fixed
# NodePorts that kind maps to localhost (see ./cluster.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: nexusgate-api
    newName: localhost/nexusgate-api
    newTag: dev

patches:
  - target: { kind: Service, name: api }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30800 }
  - target: { kind: Service, name: prometheus }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30090 }
  - target: { kind: Service, name: grafana }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30300 }
