# Overlay for a local kind cluster: the image built by Podman and loaded into kind, plus fixed
# NodePorts that kind maps to localhost (see ./cluster.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - metrics-server.yaml

images:
  - name: nexusgate-api
    newName: localhost/nexusgate-api
    newTag: dev

# The local cluster is where chaos tests run, so fault injection is on here only. The base keeps
# the safe default (off).
configMapGenerator:
  - name: nexusgate-config
    behavior: merge
    literals:
      - NEXUSGATE_FAULT_INJECTION_ENABLED=true

patches:
  - target: { kind: Service, name: api }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30800 }
  - target: { kind: Service, name: prometheus }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30090 }
  - target: { kind: Service, name: grafana }
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30300 }
  # kind's kubelets serve self-signed certificates, which metrics-server won't scrape by default.
  - target: { kind: Deployment, name: metrics-server }
    patch: |-
      - { op: add, path: /spec/template/spec/containers/0/args/-, value: --kubelet-insecure-tls }
  # One node, and one worker already saturates its CPU: the autoscaling test drained the same
  # backlog in 312 s with one worker and 324 s with four, because the extra pods only competed
  # for the same cores. The base keeps 4 for a real cluster with somewhere to put them.
  - target: { kind: HorizontalPodAutoscaler, name: worker }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 2 }
