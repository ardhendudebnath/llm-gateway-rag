# Local Kubernetes on Podman:  KIND_EXPERIMENTAL_PROVIDER=podman kind create cluster --config <this>
# The scripts in scripts/ do this for you. Host ports match the NodePorts in ./kustomization.yaml,
# so the stack is reachable on localhost without `kubectl port-forward`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nexusgate
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30800, hostPort: 8000, listenAddress: "127.0.0.1" } # API
      - { containerPort: 30090, hostPort: 9090, listenAddress: "127.0.0.1" } # Prometheus
      - { containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1" } # Grafana
