# One-command local stack:   docker compose -f infra/docker-compose.yml up --build
#
#   API         http://localhost:8000/docs
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000   (admin / admin)
#
# Later roadmap weeks add: qdrant (RAG), celery workers (ingestion), langfuse (LLM tracing).

name: nexusgate

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file:
      - path: ../.env
        required: false
    environment:
      NEXUSGATE_REDIS_URL: redis://redis:6379/0
      NEXUSGATE_CACHE_INDEX_BACKEND: redisearch
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    # redis-stack bundles the Query Engine (HNSW vector index) used by the semantic cache.
    image: redis/redis-stack-server:latest
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  redis-data:
