name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the image job is the one place that writes (to the container registry).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  # Every image is scanned, then run the way the Helm chart runs it and smoke-tested, before anything
  # else happens to it. A push to main then publishes it to ghcr.io as `main` and `sha-<commit>`; a
  # release tag vX.Y.Z publishes `X.Y.Z` (the tag the chart pulls by default), `X.Y` and `latest`.
  # Published images carry signed attestations of where they were built and what is in them. Pull
  # requests build, scan and check the image, and never push.
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # to sign attestations with a short-lived Sigstore certificate
      attestations: write
    env:
      TRIVY_VERSION: "0.75.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Work out the version and tags
        id: meta
        run: |
          version=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The chart's default image tag is its appVersion, which a test holds equal to this
            # version: a release tag that disagreed would publish an image the chart never pulls.
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
            tags="$version ${version%.*} latest"
          else
            tags="main sha-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build the API image with Podman
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          podman build --tag localhost/nexusgate-api:ci --file Containerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.description=NexusGate: LLM gateway and RAG backend" \
            .
      # Refuse a HIGH or CRITICAL vulnerability that has a fix, and list every package in the image
      # (the SBOM attested below). Unfixed findings can't block a release: there is nothing to
      # upgrade to yet, and the Containerfile takes every Debian fix the moment it ships.
      - name: Scan it for vulnerabilities, and list what is in it
        run: |
          # docker-archive: Trivy reads that tar, or an OCI directory, but not an OCI archive.
          podman save --format docker-archive --output image.tar localhost/nexusgate-api:ci
          trivy() {
            podman run --rm --volume "$PWD:/scan" --workdir /scan --volume trivy-cache:/root/.cache \
              "docker.io/aquasec/trivy:$TRIVY_VERSION" "$@"
          }
          trivy image --input image.tar --format cyclonedx --output sbom.cdx.json --quiet
          trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --quiet
          rm image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Run it as the Helm chart does, and smoke-test it
        run: |
          pip install httpx pyyaml
          python scripts/check_image.py localhost/nexusgate-api:ci
      - name: Publish to the GitHub Container Registry
        id: publish
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nexusgate-api"
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # actions/attest pushes the attestations with credentials it reads only from Docker's
          # config file, so log in there too, in Docker's format (it found none for 0.2.2).
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin \
            --compat-auth-file "$HOME/.docker/config.json"
          for tag in $TAGS; do
            podman push --digestfile digest localhost/nexusgate-api:ci "$image:$tag"
          done
          {
            echo "### Published"
            echo '```'
            for tag in $TAGS; do echo "$image:$tag"; done
            echo "$image@$(cat digest)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
      # Signed with the workflow's identity and pushed next to the image, so anyone can check which
      # commit and workflow built it, and what it contains:
      #   gh attestation verify oci://ghcr.io/ardhendudebnath/nexusgate-api:<tag> --owner ardhendudebnath
      # Storage records need an organisation-owned repository, so none are created.
      - name: Attest where it was built (SLSA provenance)
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest what is in it (the SBOM)
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

  # On a release tag, once that release's image is published: the chart, as an OCI artifact on the
  # same registry, so installing needs no clone. It carries the release's version (a test locks the
  # chart's version to the app's) and pulls the release's image, so the pair always matches.
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [k8s, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Package the chart and publish it to the GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          version=$(helm show chart infra/helm/nexusgate | grep '^version:' | cut -d ' ' -f 2)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match chart version $version"
            exit 1
          fi
          helm package infra/helm/nexusgate --destination dist
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/nexusgate-$version.tgz" "oci://$registry"
          # Read it back: render what an install from the registry would get.
          helm template nexusgate "oci://$registry/nexusgate" --version "$version" \
            --set secrets.existingSecret=check > /dev/null
          {
            echo "### Published"
            echo '```'
            echo "helm install nexusgate oci://$registry/nexusgate --version $version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The public demo is the artifact people actually see, so boot it and walk through it.
  demo:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Build the one-container demo image
        run: podman build --tag localhost/nexusgate-demo:ci --file Containerfile.demo .
      - name: Start it and wait for the handbook to load
        run: |
          podman run -d --name demo -p 7860:7860 localhost/nexusgate-demo:ci
          for _ in $(seq 90); do curl -sf localhost:7860/readyz >/dev/null && break; sleep 2; done
          curl -sf localhost:7860/readyz
      - name: Walk through it with the key from the landing page
        run: |
          pip install httpx
          key=$(curl -sf localhost:7860/ | grep -o 'ng_[A-Za-z0-9_-]*' | head -n 1)
          python scripts/demo.py --base-url http://localhost:7860 --key "$key" --pace 0
      - name: Container logs
        if: always()
        run: podman logs demo

  k8s:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render and validate manifests (base + kind overlay)
        run: |
          for dir in infra/k8s/base infra/k8s/overlays/kind; do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary -
          done
      # Every optional piece switched on (ci/test-values.yaml), so every template is validated.
      # The second schema location covers the Prometheus Operator CRDs the chart can render.
      - name: Lint and validate the Helm chart
        run: |
          helm lint infra/helm/nexusgate -f infra/helm/nexusgate/ci/test-values.yaml
          helm template ci infra/helm/nexusgate -f infra/helm/nexusgate/ci/test-values.yaml \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -
          # And an install with no secrets must be refused, not rendered with blanks.
          if helm template ci infra/helm/nexusgate >/dev/null 2>&1; then
            echo "the chart rendered without secrets" && exit 1
          fi
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
