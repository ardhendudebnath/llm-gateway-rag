# Routes for the public demo: offline mock providers only. The demo image holds no provider keys,
# so nothing a visitor does can reach a paid API.

routes:
  mock:
    - name: mock-primary
      provider: mock
      model: mock-1
      options: { latency_ms: 80 }
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
    - name: mock-secondary
      provider: mock
      model: mock-2
      options: { latency_ms: 150 }
      pricing: { input_per_mtok: 5.00, output_per_mtok: 25.00 }

  # Primary fails every call: every request shows fallback in its `attempts`.
  chaos:
    - name: mock-broken
      provider: mock
      model: mock-broken
      options: { latency_ms: 20, failure_rate: 1.0 }
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
    - name: mock-primary
      provider: mock
      model: mock-1
      options: { latency_ms: 80 }
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
