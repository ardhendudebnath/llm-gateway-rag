# Route table. A client sends `"model": "<alias>"`; the router walks that alias's deployments in
# order, falling back on timeout / 429 / 5xx / connection errors and skipping any deployment whose
# circuit breaker is open. A provider-side 400 (bad request) fails fast instead.
#
# Prices are USD per million tokens. Verify them against the providers' current price pages —
# they are what cost metering and the "$ saved by cache" numbers are computed from.

routes:
  default:
    - name: anthropic-haiku
      provider: litellm
      model: anthropic/claude-haiku-4-5-20251001     # needs ANTHROPIC_API_KEY
      timeout_seconds: 30
      max_retries: 1
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
    - name: openai-mini
      provider: litellm
      model: openai/gpt-4.1-mini                     # needs OPENAI_API_KEY
      timeout_seconds: 30
      pricing: { input_per_mtok: 0.40, output_per_mtok: 1.60 }
    # Last resort, and the reason this route answers with no API keys at all: the self-hosted model.
    - &local-qwen
      name: local-qwen
      provider: litellm
      model: hosted_vllm/qwen2.5-1.5b-instruct       # any OpenAI-compatible server; here llama.cpp
      api_base: http://llm:8080/v1                   # infra/k8s/base/llm.yaml, Containerfile.llm
      timeout_seconds: 120                           # CPU inference: a long answer takes a while
      self_hosted: true                              # metered apart from paid providers
      pricing: { input_per_mtok: 0.0, output_per_mtok: 0.0 }

  # The self-hosted model alone: Qwen2.5-1.5B-Instruct, 4-bit, on CPU. Real answers, no key, no
  # per-token cost.
  local:
    - *local-qwen

  # Offline routes: no API keys, no spend. Used by the demo, load tests and chaos tests.
  mock:
    - name: mock-primary
      provider: mock
      model: mock-1
      options: { latency_ms: 80 }
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
    # Slower and pricier on purpose: the chaos test shows what failing over costs, not just that
    # it works. Only used when mock-primary fails (e.g. a fault injected via /v1/admin/faults).
    - name: mock-secondary
      provider: mock
      model: mock-2
      options: { latency_ms: 150 }
      pricing: { input_per_mtok: 5.00, output_per_mtok: 25.00 }

  # Primary fails 100% of the time -> every request exercises fallback, then the breaker opens.
  chaos:
    - name: mock-broken
      provider: mock
      model: mock-broken
      options: { latency_ms: 20, failure_rate: 1.0 }
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
    - name: mock-primary
      provider: mock
      model: mock-1
      options: { latency_ms: 80 }
      pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
